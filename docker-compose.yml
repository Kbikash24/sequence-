services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sequence
      POSTGRES_PASSWORD: sequence
      POSTGRES_DB: sequence_arena
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sequence -d sequence_arena"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
